name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Betterleaks
        shell: bash
        run: |
          set -euo pipefail

          version="1.7.2"
          archive="betterleaks_${version}_linux_x64.tar.gz"

          curl -fsSL \
            "https://github.com/betterleaks/betterleaks/releases/download/v${version}/${archive}" \
            -o "${archive}"

          echo "ea9ed6a4aa2845ac2e00c0eafbc841057631321d53c061d5a435cf33e6e9ddaf  ${archive}" \
            | sha256sum --check -

          tar -xzf "${archive}" betterleaks
          sudo install -m 0755 betterleaks /usr/local/bin/betterleaks

          betterleaks --version

      - name: Betterleaks
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            betterleaks dir . \
              --config .gitleaks.toml \
              --redact
          else
            betterleaks git . \
              --config .gitleaks.toml \
              --redact
          fi

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --exclude-paths=.trufflehog-exclude-paths.txt
